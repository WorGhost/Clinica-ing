{% extends 'base.html' %}{% block title %}Nuevo paciente{% endblock %}{% block content %}<div class="head"><div><small>REGISTRO</small><h1>Nuevo paciente</h1></div></div><form class="card form" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Documento<input name="document" required></label><label>Nombre completo<input name="name" required></label><label>Nacimiento<input type="date" name="birth_date"></label><label>Teléfono<input name="phone" required></label><label>Correo<input type="email" name="email"></label><label>Chat ID de Telegram<input name="chat_id" placeholder="Opcional. Tu ID de Telegram para notificaciones"></label><label>Grupo<select name="blood">{% for b in ['','O+','O-','A+','A-','B+','B-','AB+','AB-'] %}<option>{{b}}</option>{% endfor %}</select></label><button class="primary full">Guardar</button></form>{% endblock %}
