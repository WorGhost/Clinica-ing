{% extends 'base.html' %}{% block title %}Agregar médico{% endblock %}{% block content %}<div class="head"><h1>Agregar médico</h1></div><form class="card form" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Nombre<input name="name" required></label><label>Correo<input type="email" name="email" required></label><label>Colegiatura<input name="license" required></label><label>Especialidad<select name="specialty_id">{% for s in specialties %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></label><label>Clave temporal<input name="password" value="demo123"></label><button class="primary full">Guardar</button></form>{% endblock %}
