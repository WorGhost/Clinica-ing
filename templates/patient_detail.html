{% extends 'base.html' %}{% block title %}Paciente{% endblock %}{% block content %}<section class="card profile"><div class="avatar big">{{p.name[0]}}</div><div class="grow"><small>PACIENTE</small><h1>{{p.name}}</h1><p>{{p.document}} · Grupo {{p.blood or '—'}}</p>{% if p.chat_id %}<p><small>Telegram:</small> {{p.chat_id}}</p>{% endif %}</div>{% if current_user.role=='MEDICO' %}<a class="primary" href="{{url_for('history',id=p.id)}}">Historia clínica</a>{% endif %}</section>{% endblock %}
