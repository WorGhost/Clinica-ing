{% extends 'base.html' %}{% block title %}Auditoría{% endblock %}{% block content %}<div class="head"><h1>Auditoría</h1></div><section class="card table"><table><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th><th>Detalle</th></tr>{% for x in logs %}<tr><td>{{x.created}}</td><td>{{x.user.name if x.user else 'Sistema'}}</td><td>{{x.action}}</td><td>{{x.entity}} #{{x.entity_id}}</td><td>{{x.detail}}</td></tr>{% endfor %}</table></section>{% endblock %}
