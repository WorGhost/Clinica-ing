{% extends 'base.html' %}{% block title %}Nueva cita{% endblock %}{% block content %}<div class="head"><h1>Nueva reservación</h1></div><form class="card form" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Paciente<select name="patient_id">{% for p in patients %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></label><label>Tipo<select name="reservation_type"><option>PRESENCIAL</option><option>TELECONSULTA</option><option>DOMICILIO</option><option>EMERGENCIA PROGRAMADA</option></select></label><label>Médico<select id="doctor" name="doctor_id">{% for d in doctors %}<option value="{{d.id}}">{{d.user.name}}</option>{% endfor %}</select></label><label>Servicio<select id="service" name="service_id">{% for s in services %}<option value="{{s.id}}">{{s.name}} · ${{s.price_usd}}</option>{% endfor %}</select></label><label>Fecha<input id="date" type="date"></label><div class="full"><b>Horario</b><div id="slots" class="slots"></div><input id="starts" type="hidden" name="starts" required></div><label class="full">Motivo<textarea name="reason"></textarea></label><button class="primary full">Crear y continuar al pago</button></form>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/appointments.js')}}"></script>{% endblock %}
