{% extends 'base.html' %}{% block title %}Consulta médica{% endblock %}{% block content %}<div class="head"><div><small>ATENCIÓN</small><h1>{{x.patient.name}}</h1></div></div>{% if x.patient.history.allergies %}<div class="allergy">⚠ Alergia: {% for a in x.patient.history.allergies %}{{a.substance}}{% endfor %}</div>{% endif %}<form method="post" class="card form"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label class="full">Motivo<input name="motive" required></label><label>Signos vitales<input name="vitals" placeholder="PA 120/80 · Pulso 72"></label><label>Examen físico<textarea name="exam"></textarea></label><label>Diagnóstico<textarea name="diagnosis"></textarea></label><label>Tratamiento<textarea name="treatment"></textarea></label><button class="primary full">Finalizar y crear receta</button></form>{% endblock %}
